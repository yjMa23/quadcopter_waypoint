params:
  seed: 42

  env:
    clip_actions: 1.0

  algo:
    name: p8b_actor_preserving

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: True
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [64, 64]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: quadcopter_ship_landing_p8b_actor_preserving
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-4
    lr_schedule: adaptive
    schedule_type: legacy
    kl_threshold: 0.016
    score_to_win: 20000
    max_epochs: 200
    save_best_after: 20
    save_frequency: 10
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 24
    minibatch_size: 384
    mini_epochs: 5
    critic_coef: 2
    clip_value: True
    seq_length: 4
    bounds_loss_coef: 0.0001
    p8b:
      schema_version: p8b-separate-v1
      warmup_epochs: 10
      freeze_lr_scheduler_during_warmup: True
      freeze_observation_rms: True
      bc_anchor_type: mse_mean_action
      bc_anchor_coefficient: 10.0
      reference_checkpoint_sha256: ''
